name: Sugar Prices

permissions:
  contents: write

on:
  workflow_dispatch:

  schedule:
    - cron: "0 19 * * 1-5"

jobs:
  run-scraper:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: |
          pip install requests pandas

      - name: Executar scraper
        run: |
          python sugar_prices.py

      - name: TESTE DE NOTIFICAÇÃO
        run: |
          echo "Teste de falha proposital"
          exit 1
          
      - name: Salvar CSV no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sugar_prices.csv sugar_history.csv

          git commit -m "Atualizar dados de mercado" || echo "Nenhuma alteração"

          git push origin HEAD:main
